# Builds both exes on every pull request and push to main, so compile errors show up before a release,
# and keeps them as a run artifact so a pull request can be tested before it is merged.
name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Inno Setup builds the setup; install it when the runner image doesn't have it.
      - name: Install Inno Setup
        shell: powershell
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe")) { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed" } }

      - name: Build
        shell: powershell
        run: ./build.ps1
      # Lets a pull request be tested on Windows before it's merged: download the exes from the run's Summary page.
      - name: Upload exes
        uses: actions/upload-artifact@v4
        with:
          name: PowerModeToggle-exes
          path: |
            PowerModeToggle.exe
            PowerModeToggle-Setup.exe
